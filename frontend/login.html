<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập hệ thống - Bãi xe thông minh</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f3f4f6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }

    .login-card {
      background-color: #ffffff;
      border: 2px solid #9ca3af;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      padding: 32px 28px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 16px;
    }

    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-header p {
      font-size: 0.85rem;
      color: #6b7280;
      margin: 0;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
    }

    .login-btn {
      width: 100%;
      background-color: #1d4ed8;
      color: #ffffff;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-btn:hover {
      background-color: #1e40af;
    }

    .login-btn:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    .error-box {
      background-color: #fee2e2;
      border: 1px solid #ef4444;
      color: #b91c1c;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 18px;
      display: none;
    }

    .demo-accounts {
      margin-top: 24px;
      background-color: #f9fafb;
      border: 1px dashed #d1d5db;
      border-radius: 4px;
      padding: 14px;
      font-size: 0.8rem;
      color: #4b5563;
    }

    .demo-accounts p {
      font-weight: 700;
      margin-bottom: 8px;
      color: #1f2937;
    }

    .demo-pill {
      display: inline-block;
      background-color: #e5e7eb;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      cursor: pointer;
      margin-right: 6px;
      margin-bottom: 6px;
      border: 1px solid #d1d5db;
      user-select: none;
    }

    .demo-pill:hover {
      background-color: #dbeafe;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
    }

    .back-link a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h1>HỆ THỐNG QUẢN LÝ BÃI XE</h1>
      <p>Cổng Đăng Nhập Cán Bộ Quản Trị & Nhân Viên</p>
    </div>

    <div id="errorBox" class="error-box"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="usernameInput">Tên đăng nhập:</label>
        <input type="text" id="usernameInput" required placeholder="Nhập tên tài khoản..." autocomplete="username">
      </div>

      <div class="form-group">
        <label for="passwordInput">Mật khẩu:</label>
        <input type="password" id="passwordInput" required placeholder="Nhập mật khẩu..." autocomplete="current-password">
      </div>

      <button type="submit" id="submitBtn" class="login-btn">ĐĂNG NHẬP HỆ THỐNG</button>
    </form>

    <div class="demo-accounts">
      <p>Tài khoản mẫu thử nghiệm (nhấp để điền nhanh):</p>
      <div>
        <span class="demo-pill" onclick="fillAccount('admin', 'admin123')">Quản trị viên (admin / admin123)</span>
        <span class="demo-pill" onclick="fillAccount('staff1', 'staff123')">Nhân viên bảo vệ (staff1 / staff123)</span>
      </div>
    </div>

    <div class="back-link">
      <a href="/">← Quay lại Màn hình Trực bãi</a> | 
      <a href="/lookup">Tra cứu khách hàng</a>
    </div>
  </div>

  <script>
    function fillAccount(u, p) {
      document.getElementById('usernameInput').value = u;
      document.getElementById('passwordInput').value = p;
      document.getElementById('errorBox').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('usernameInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const errorBox = document.getElementById('errorBox');
      const submitBtn = document.getElementById('submitBtn');

      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'ĐANG XỬ LÝ...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          errorBox.textContent = data.error || 'Đăng nhập không thành công!';
          errorBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'ĐĂNG NHẬP HỆ THỐNG';
          return;
        }

        // Lưu thông tin đăng nhập vào LocalStorage
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));

        // Điều hướng theo vai trò (Role-based redirect)
        if (data.user.role === 'ADMIN') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/';
        }

      } catch (err) {
        errorBox.textContent = 'Lỗi kết nối tới máy chủ!';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'ĐĂNG NHẬP HỆ THỐNG';
      }
    }

    // Nếu đã đăng nhập trước đó, kiểm tra token
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('auth_token');
      const user = localStorage.getItem('auth_user');
      if (token && user) {
        try {
          const u = JSON.parse(user);
          if (u.role === 'ADMIN') {
            window.location.href = '/admin';
          }
        } catch (e) {}
      }
    });
  </script>
</body>
</html>
